# Settings that apply wherever this app runs, deployment included.

[server]
# Poll file modification times, and reload local modules when they change.
#
# Two separate reasons, one per environment:
#
# Locally, this project lives on a Google Drive virtual drive, which does not
# emit the OS-level change notifications the default watchdog watcher listens
# for. With the watcher deaf, an edited module stays in sys.modules and the
# server has to be restarted by hand after every change.
#
# On Streamlit Community Cloud, pushing shows "Updated app!" and re-executes
# app.py and the app_pages/ scripts — but does NOT re-import modules. So a
# change to ui.py or spotify_sync.py left new callers running against old
# modules, surfacing as an AttributeError or TypeError naming a function
# plainly present in the file, and needing a manual reboot every time.
#
# This was previously set to "none" because reloading a module crashed the
# whole app: dataclasses resolved the string annotations from
# `from __future__ import annotations` via sys.modules, which is empty for a
# module mid-reload. That import is now gone from every module defining a
# dataclass, and tests/test_module_reload.py fails if it returns or if any
# of those modules stops surviving a reload — so the reason for "none" no
# longer holds.
#
# If module reloading ever does destabilise the deployed app, setting this
# back to "none" restores the old behaviour at the cost of a reboot after
# every change to an imported module.
fileWatcherType = "poll"
